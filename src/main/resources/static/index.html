<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Relay Agent Inbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400&family=Young+Serif&display=swap">
<style>
/* Layout: two panes. Inbox list on the left, one conversation on the right that reads top to bottom:
   the customer's words, what the agent did, then the one decision it needs from you. */
:root {
  --bg: #f8f7f4;
  --panel: #ffffff;
  --sunk: #f0eee9;
  --line: #e6e2db;
  --ink: #221c18;
  --muted: #706a63;
  --leaf: #2d6a52;
  --leaf-ink: #ffffff;
  --leaf-soft: #e3efe8;
  --honey: #9a6210;
  --honey-soft: #fbf0db;
  --cherry: #b23c35;
  --cherry-soft: #f9e6e3;
  --display: "Young Serif", Georgia, "Times New Roman", serif;
  --body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151412; --panel: #1d1b19; --sunk: #252320; --line: #2f2c28; --ink: #eeeae4; --muted: #a39d95;
    --leaf: #7cc4a3; --leaf-ink: #10241b; --leaf-soft: #1d3129; --honey: #e8b462; --honey-soft: #362b18;
    --cherry: #f08b80; --cherry-soft: #3a2220; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151412; --panel: #1d1b19; --sunk: #252320; --line: #2f2c28; --ink: #eeeae4; --muted: #a39d95;
  --leaf: #7cc4a3; --leaf-ink: #10241b; --leaf-soft: #1d3129; --honey: #e8b462; --honey-soft: #362b18;
  --cherry: #f08b80; --cherry-soft: #3a2220; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; }
[hidden] { display: none !important; }
button, textarea, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--leaf); outline-offset: 2px; }

.app { min-height: 100%; display: flex; flex-direction: column; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); padding-block: 18px 24px; gap: 22px; max-width: 1280px; margin: 0 auto; }

.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 17px; }
.brand i { width: 22px; height: 22px; border-radius: 50%; background: var(--leaf); display: inline-block; position: relative; }
.brand i::after { content: ""; position: absolute; inset: 6px 9px; border-radius: 4px; background: var(--panel); transform: rotate(28deg); }
.shop { color: var(--muted); font-size: 14px; }
.top .agent { margin-left: auto; font-size: 13px; color: var(--muted); }
.top .agent b { font-weight: 600; color: var(--ink); }

.hello h1 { font-family: var(--display); font-weight: 400; font-size: clamp(28px, 4vw, 38px); line-height: 1.15; margin: 0 0 6px; letter-spacing: -.01em; text-wrap: balance; }
.hello p { margin: 0; color: var(--muted); font-size: 16px; max-width: 62ch; }

.main { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 28px; align-items: start; flex: 1; }

/* inbox list */
.side { display: flex; flex-direction: column; gap: 12px; position: sticky; top: 12px; }
.tabs { display: flex; gap: 4px; background: var(--sunk); padding: 4px; border-radius: 12px; }
.tab { flex: 1; border: 0; background: transparent; padding: 7px 6px; border-radius: 9px; font-size: 13.5px; color: var(--muted); font-weight: 500; white-space: nowrap; }
.tab[aria-selected="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(30, 20, 10, .08); }
.tab span { font-variant-numeric: tabular-nums; opacity: .7; margin-left: 3px; }
.rows { display: flex; flex-direction: column; gap: 2px; }
.row { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; padding: 11px 12px; border: 0; border-radius: 12px; background: transparent; text-align: left; width: 100%; }
.row:hover { background: var(--sunk); }
.row[aria-current="true"] { background: var(--panel); box-shadow: 0 1px 3px rgba(30, 20, 10, .07); }
.face { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 600; grid-row: span 2; background: hsl(var(--h) 45% 88%); color: hsl(var(--h) 40% 28%); flex: none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .face:not(.relay-face) { background: hsl(var(--h) 25% 24%); color: hsl(var(--h) 45% 82%); } }
:root[data-theme="dark"] .face:not(.relay-face) { background: hsl(var(--h) 25% 24%); color: hsl(var(--h) 45% 82%); }
.row .name { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .time { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .line { grid-column: 2 / 4; display: flex; gap: 8px; align-items: center; min-width: 0; }
.row .subj { color: var(--muted); font-size: 14px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.pill { font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.pill.p-ask { background: var(--honey-soft); color: var(--honey); }
.pill.p-team { background: var(--cherry-soft); color: var(--cherry); }
.pill.p-done { background: var(--leaf-soft); color: var(--leaf); }
.pill.p-busy { background: var(--sunk); color: var(--muted); }
.new { border: 1px dashed var(--line); background: transparent; border-radius: 12px; padding: 10px; color: var(--muted); font-size: 14px; }
.new:hover { color: var(--ink); border-color: var(--muted); }
.calm { padding: 28px 12px; color: var(--muted); text-align: center; }
.calm b { display: block; font-family: var(--display); font-weight: 400; font-size: 20px; color: var(--ink); margin-bottom: 4px; }

/* conversation */
.convo { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: clamp(20px, 3vw, 36px); display: flex; flex-direction: column; gap: 26px; min-width: 0; }
.convo h2 { font-family: var(--display); font-weight: 400; font-size: 26px; line-height: 1.2; margin: 0 0 6px; text-wrap: balance; }
.meta { color: var(--muted); font-size: 13.5px; display: flex; gap: 6px 14px; flex-wrap: wrap; }
.said { display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 14px; }
.said .who { font-weight: 600; font-size: 14px; margin-bottom: 6px; }
.said .who small { color: var(--muted); font-weight: 400; margin-left: 6px; }
.bubble { background: var(--sunk); border-radius: 4px 16px 16px 16px; padding: 14px 18px; max-width: 64ch; }
.bubble p { margin: 0 0 10px; }
.bubble p:last-child { margin: 0; }
.face.relay-face { background: var(--leaf); color: var(--leaf-ink); }

.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.step { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 10px; }
.step .dot { width: 8px; height: 8px; border-radius: 50%; margin: 8px 5px 0; background: var(--leaf); }
.step.wait .dot { background: var(--honey); }
.step.stop .dot { background: var(--cherry); }
.step.think .dot { background: var(--muted); }
.step .t { font-weight: 500; }
.step .n { color: var(--muted); font-size: 14px; }
.step details { margin-top: 4px; }
.step summary { font-size: 12.5px; color: var(--muted); cursor: pointer; width: fit-content; }
.step pre { margin: 6px 0 0; padding: 10px 12px; background: var(--sunk); border-radius: 10px; font-family: var(--mono); font-size: 12px; line-height: 1.55; overflow-x: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
.step.enter { animation: rise .35s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.working { color: var(--muted); font-size: 14px; display: flex; gap: 8px; align-items: center; }
.working i { width: 8px; height: 8px; border-radius: 50%; background: var(--leaf); animation: breathe 1.2s ease-in-out infinite; }
@keyframes breathe { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .step.enter, .working i { animation: none; } }

.ask { border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.ask .kicker { font-size: 13px; color: var(--muted); }
.ask .big { font-family: var(--display); font-size: 22px; line-height: 1.25; }
.ask .big b { font-weight: 400; color: var(--honey); }
.ask .why { font-size: 13.5px; color: var(--muted); margin-top: -8px; }
.ask.team .big b { color: var(--cherry); }
.ask.done .big b { color: var(--leaf); }
.letter-label { font-size: 13px; color: var(--muted); }
textarea { width: 100%; min-height: 190px; resize: vertical; padding: 16px 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); line-height: 1.6; }
.letter { white-space: pre-wrap; padding: 16px 18px; border-radius: 12px; background: var(--sunk); line-height: 1.6; max-width: 64ch; }
.btns { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--panel); padding: 11px 18px; border-radius: 999px; font-weight: 600; }
.btn:hover { background: var(--sunk); }
.btn.go { background: var(--leaf); border-color: var(--leaf); color: var(--leaf-ink); }
.btn.go:hover { filter: brightness(1.07); background: var(--leaf); }
.btn[disabled] { opacity: .55; cursor: default; }
.sure { margin-left: auto; font-size: 13px; color: var(--muted); }

.form { display: grid; gap: 12px; }
.form label { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
.form input { padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
.form textarea { min-height: 120px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chips button { font-size: 13px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); }
.chips button:hover { background: var(--sunk); }
.err { color: var(--cherry); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(22px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 11px 18px; border-radius: 999px; font-weight: 500; z-index: 20; }

@media (max-width: 900px) {
  .main { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; }
  .rows { max-height: 320px; overflow: auto; }
}
@media (max-width: 520px) {
  .two { grid-template-columns: 1fr; }
  .shop { display: none; }
  .sure { margin-left: 0; width: 100%; }
}
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><i aria-hidden="true"></i>Relay</div>
    <span class="shop">Northwind Coffee Co.</span>
    <span class="agent" id="agent"></span>
  </header>

  <section class="hello">
    <h1 id="hello">Good morning.</h1>
    <p id="summary">Catching up on the inbox…</p>
  </section>

  <div class="main">
    <aside class="side">
      <div class="tabs" role="tablist" id="tabs"></div>
      <div class="rows" id="rows"></div>
      <button class="new" id="compose">Write a test email</button>
    </aside>
    <article class="convo" id="convo" aria-live="polite"></article>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const TABS = [
  { id: "ask", name: "Waiting", match: s => s === "AWAITING_APPROVAL" },
  { id: "team", name: "Team", match: s => s === "ESCALATED" },
  { id: "done", name: "Done", match: s => s === "RESOLVED" },
  { id: "all", name: "All", match: () => true }
];
const PRESETS = [
  { label: "Broken parcel", customerName: "Laura Gómez", customerEmail: "laura.gomez@example.com", subject: "Order 48213 arrived broken",
    body: "Hola, the box for order 48213 was crushed and the dripper inside is broken. I'd like my money back please." },
  { label: "Where is it?", customerName: "Jonas Weber", customerEmail: "jonas.weber@example.com", subject: "Tracking for 48302",
    body: "Any update on order 48302? It has said in transit since Monday." },
  { label: "Angry claim", customerName: "Sophie Laurent", customerEmail: "sophie.laurent@example.com", subject: "I want compensation",
    body: "Your descaler ruined my grinder and my machine. Repair is €640. My lawyer will contact you if this isn't paid." }
];

const state = { tickets: [], tab: "ask", current: null, seen: new Set(), composing: false };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const DEMO = typeof window.relayDemoApi === "function";

function csrf() {
  const m = document.cookie.match(/(?:^|; )XSRF-TOKEN=([^;]+)/);
  return m ? decodeURIComponent(m[1]) : "";
}
async function api(path, opts = {}) {
  if (DEMO) return window.relayDemoApi(path, opts);
  const headers = { "Content-Type": "application/json" };
  if (opts.method && opts.method !== "GET") headers["X-XSRF-TOKEN"] = csrf();
  const res = await fetch(path, { headers, credentials: "same-origin", ...opts });
  if (!res.ok) {
    let msg = res.status + "";
    try { msg = (await res.json()).detail || msg; } catch (e) {}
    throw new Error(msg);
  }
  return res.status === 202 || res.status === 204 ? null : res.json();
}

const first = n => n.split(/\s+/)[0];
const initials = n => n.split(/\s+/).map(p => p[0]).slice(0, 2).join("").toUpperCase();
function face(name) {
  let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) % 360;
  return `--h:${h}`;
}
const hhmm = iso => new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
const paras = s => esc(s).split(/\n\n+/).map(p => `<p>${p.replace(/\n/g, "<br>")}</p>`).join("");

function pill(t) {
  const a = (t.actions || []).find(x => x.status === "PENDING");
  if (t.status === "AWAITING_APPROVAL") return `<span class="pill p-ask">${esc(a ? short(a) : "Reply")}</span>`;
  if (t.status === "ESCALATED") return `<span class="pill p-team">Team</span>`;
  if (t.status === "RESOLVED") return `<span class="pill p-done">Sent</span>`;
  return `<span class="pill p-busy">Working</span>`;
}
function short(a) {
  return { REFUND: a.amount + " refund", ADDRESS_CHANGE: "New address", SEND_INVOICE: "Invoice" }[a.type] || a.summary;
}

function greet(stats) {
  const h = new Date().getHours();
  $("hello").textContent = h < 12 ? "Good morning." : h < 19 ? "Good afternoon." : "Good evening.";
  const waiting = stats.awaitingApproval, solo = state.tickets.filter(t => t.resolvedByAgent).length, team = stats.escalated;
  const parts = [];
  parts.push(waiting === 0 ? "Nobody is waiting on you." : waiting === 1 ? "One customer is waiting on your yes." : `${waiting} customers are waiting on your yes.`);
  const did = [];
  if (solo) did.push(`answered ${solo} on my own`);
  if (team) did.push(`passed ${team} to the team`);
  if (did.length) parts.push("I " + did.join(" and ") + ".");
  $("summary").textContent = parts.join(" ");
  $("agent").innerHTML = `Agent <b>${esc(stats.agent.replace("claude:", ""))}</b>`;
}

async function refresh() {
  const [tickets, stats] = await Promise.all([api("/api/tickets"), api("/api/stats")]);
  state.tickets = tickets;
  greet(stats);
  renderTabs(); renderRows();
}

function visible() { const t = TABS.find(x => x.id === state.tab); return state.tickets.filter(x => t.match(x.status)); }

function renderTabs() {
  $("tabs").innerHTML = TABS.map(t => {
    const n = state.tickets.filter(x => t.match(x.status)).length;
    return `<button class="tab" role="tab" data-tab="${t.id}" aria-selected="${t.id === state.tab}">${t.name}<span>${n}</span></button>`;
  }).join("");
}

function renderRows() {
  const items = visible();
  $("rows").innerHTML = items.length ? items.map(t => `
    <button class="row" data-id="${t.id}" aria-current="${t.id === state.current && !state.composing}">
      <span class="face" style="${face(t.customerName)}">${esc(initials(t.customerName))}</span>
      <span class="name">${esc(t.customerName)}</span><span class="time">${hhmm(t.receivedAt)}</span>
      <span class="line"><span class="subj">${esc(t.subject)}</span>${pill(t)}</span>
    </button>`).join("")
    : state.tab === "ask"
      ? `<div class="calm"><b>All caught up.</b>Go get a coffee. I'll keep an eye on the inbox.</div>`
      : `<div class="calm">Nothing here yet.</div>`;
}

async function select(id) {
  state.current = id; state.composing = false; state.seen = new Set();
  renderRows();
  await loadConvo(false);
}
async function loadConvo(animate) {
  if (!state.current || state.composing) return;
  renderConvo(await api("/api/tickets/" + state.current), animate);
}

function details(s) {
  if (!s.tool || s.tool === "submit_reply") return "";
  const out = s.output && typeof s.output === "object"
    ? Object.fromEntries(Object.entries(s.output).filter(([k]) => k !== "note" && k !== "action_id")) : s.output;
  return `<details><summary>Details</summary><pre>${esc(s.tool)}(${esc(JSON.stringify(s.input))})\n→ ${esc(JSON.stringify(out, null, 1))}</pre></details>`;
}
function stepHtml(s, animate) {
  const k = { THINK: "think", TOOL: "", WAIT: "wait", STOP: "stop", DONE: "" }[s.kind];
  return `<li class="step ${k}${animate ? " enter" : ""}"><span class="dot"></span><div>
    <div class="t">${esc(s.title)}</div>${s.note ? `<div class="n">${esc(s.note)}</div>` : ""}${details(s)}</div></li>`;
}

function decision(t) {
  const pending = t.actions.filter(a => a.status === "PENDING");
  const approved = t.actions.filter(a => a.status === "APPROVED");
  if (t.status === "AWAITING_APPROVAL") {
    const name = esc(first(t.customerName));
    const phrase = a => ({
      REFUND: `refund <b>${esc(a.amount)}</b> to ${name}'s card`,
      ADDRESS_CHANGE: `send ${name}'s parcel to <b>the new address</b>`,
      SEND_INVOICE: `send ${name} <b>a corrected invoice</b>`
    }[a.type] || esc(a.summary));
    const what = pending.length ? pending.map(phrase).join(" and ") : `send ${name} <b>this reply</b>`;
    return `<div class="ask">
      <div class="kicker">I'd like your OK to</div>
      <div class="big">${what}.</div>
      ${pending.length ? `<div class="why">${pending.map(a => esc(a.detail)).join(" · ")}</div>` : ""}
      <label class="letter-label" for="reply-edit">The reply I wrote for ${esc(first(t.customerName))}</label>
      <textarea id="reply-edit">${esc(t.reply)}</textarea>
      <div class="btns"><button class="btn go" id="approve">Approve and send</button><button class="btn" id="handover">I'll handle it</button>
      ${t.confidence != null ? `<span class="sure">I'm ${Math.round(t.confidence * 100)}% sure about this one</span>` : ""}</div>
    </div>`;
  }
  if (t.status === "ESCALATED") {
    return `<div class="ask team"><div class="kicker">I didn't reply</div><div class="big"><b>Passed to the team.</b></div><div class="why">${esc(t.escalationReason)}</div></div>`;
  }
  if (t.status === "RESOLVED") {
    const how = approved.length ? approved.map(a => a.result).join(" · ") : t.resolvedByAgent ? "Answered on my own, nothing in the account changed." : "Sent after your OK.";
    return `<div class="ask done"><div class="kicker">${esc(how)}</div><div class="big"><b>Sent to ${esc(first(t.customerName))}.</b></div><div class="letter">${esc(t.reply)}</div></div>`;
  }
  return "";
}

function renderConvo(t, animate) {
  const draft = $("reply-edit") && t.status === "AWAITING_APPROVAL" ? $("reply-edit").value : null;
  const busy = t.status === "RUNNING" || t.status === "NEW";
  const secs = (t.steps.reduce((a, s) => a + s.durationMs, 0) / 1000).toFixed(1);
  $("convo").innerHTML = `
    <div><h2>${esc(t.subject)}</h2><div class="meta"><span>${esc(t.customerEmail)}</span><span>${esc(t.channel)}</span><span>${hhmm(t.receivedAt)}</span></div></div>
    <div class="said"><span class="face" style="${face(t.customerName)}">${esc(initials(t.customerName))}</span>
      <div><div class="who">${esc(t.customerName)}</div><div class="bubble">${paras(t.body)}</div></div></div>
    ${decision(t)}
    <div class="said"><span class="face relay-face">R</span>
      <div><div class="who">${busy ? "Relay<small>working on it</small>" : `How I got here<small>${t.steps.length} steps · ${secs} s</small>`}</div>
      <ol class="steps">${t.steps.map(s => { const fresh = animate && !reduce && !state.seen.has(s.id); state.seen.add(s.id); return stepHtml(s, fresh); }).join("")}</ol>
      ${busy ? `<div class="working"><i></i>Looking into it…</div>` : ""}</div></div>`;
  if (draft != null) $("reply-edit").value = draft;
  if ($("approve")) $("approve").onclick = e => act(e.target, "/approve", { reply: $("reply-edit").value }, `Sent to ${first(t.customerName)}`);
  if ($("handover")) $("handover").onclick = e => act(e.target, "/hand-over", {}, `It's yours. I won't touch ${first(t.customerName)}'s account.`);
}

async function act(btn, path, body, done) {
  btn.disabled = true;
  try {
    await api("/api/tickets/" + state.current + path, { method: "POST", body: JSON.stringify(body) });
    toast(done);
    await refresh();
    const next = visible().find(x => x.id !== state.current);
    if (next) await select(next.id); else await loadConvo(false);
  } catch (e) { toast("That didn't work: " + e.message); btn.disabled = false; }
}

function renderCompose(p = PRESETS[0]) {
  state.composing = true; renderRows();
  $("convo").innerHTML = `<div><h2>Send a test email</h2><div class="meta">I'll pick it up the moment it lands.</div></div>
    <div class="chips">${PRESETS.map((x, i) => `<button type="button" data-preset="${i}">${x.label}</button>`).join("")}</div>
    <form class="form" id="compose-form">
      <div class="two"><label>Name<input id="f-name" required value="${esc(p.customerName)}"></label>
      <label>Email<input id="f-email" type="email" required value="${esc(p.customerEmail)}"></label></div>
      <label>Subject<input id="f-subject" required value="${esc(p.subject)}"></label>
      <label>Message<textarea id="f-body" required>${esc(p.body)}</textarea></label>
      <div class="btns"><button class="btn go" type="submit">Send it</button></div>
    </form>`;
  document.querySelectorAll("[data-preset]").forEach(b => b.onclick = () => renderCompose(PRESETS[+b.dataset.preset]));
  $("compose-form").onsubmit = async e => {
    e.preventDefault();
    const btn = e.submitter; btn.disabled = true;
    try {
      const t = await api("/api/tickets", { method: "POST", body: JSON.stringify({
        customerName: $("f-name").value, customerEmail: $("f-email").value, channel: "Email",
        subject: $("f-subject").value, body: $("f-body").value }) });
      state.tab = "all"; await refresh(); await select(t.id);
    } catch (err) { toast("Couldn't send it: " + err.message); btn.disabled = false; }
  };
}

let toastTimer;
function toast(msg) { const el = $("toast"); el.textContent = msg; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => el.hidden = true, 2800); }

$("tabs").addEventListener("click", async e => {
  const b = e.target.closest(".tab"); if (!b) return;
  state.tab = b.dataset.tab; renderTabs(); renderRows();
  const f = visible()[0]; if (f) await select(f.id);
});
$("rows").addEventListener("click", e => { const b = e.target.closest(".row"); if (b) select(b.dataset.id); });
$("compose").onclick = () => renderCompose();
if (DEMO) $("compose").hidden = true;

let pending;
const soon = fn => { clearTimeout(pending); pending = setTimeout(fn, 120); };
function connect() {
  if (DEMO) return;
  const es = new EventSource("/api/events");
  es.addEventListener("step", ev => { if (JSON.parse(ev.data).ticketId === state.current) soon(() => loadConvo(true)); });
  es.addEventListener("ticket", ev => { refresh(); if (JSON.parse(ev.data).ticketId === state.current) soon(() => loadConvo(true)); });
  es.onerror = () => { es.close(); setTimeout(connect, 3000); };
}

(async function start() {
  try {
    await refresh();
    if (!visible().length) { state.tab = "all"; renderTabs(); renderRows(); }
    const f = visible()[0];
    if (f) await select(f.id); else if (!DEMO) renderCompose();
  } catch (e) {
    $("convo").innerHTML = `<p class="err">I can't reach the Relay server (${esc(e.message)}). Is the backend running?</p>`;
  }
  connect();
})();
</script>
</body>
</html>
