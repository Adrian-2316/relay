services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: relay
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - relay-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://db:5432/relay
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      RELAY_OPERATOR_PASSWORD: ${RELAY_OPERATOR_PASSWORD:?Set RELAY_OPERATOR_PASSWORD in .env}
      # Leave empty to run the scripted agent; set it to let Claude work the tickets.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8080:8080"

volumes:
  relay-db:
